name: flake check

# Catch a broken flake (eval errors, bad options, missing files, a malformed new
# host entry) BEFORE it reaches a device — onboarding builds the flake live on the
# new Mac and setup.sh masks darwin-rebuild failures, so without this a broken
# config only surfaces during an onboard. See rh7/rh-device-management#12.
#
# Gate = pure EVALUATION of every darwinConfiguration's system derivation
# (--no build). Evaluation is cross-platform, so a cheap Linux runner can validate
# the aarch64-darwin Mac configs without macOS minutes and without building.
# (`nix flake check --all-systems` is intentionally NOT used: it cross-evaluates
# the aarch64-linux nixos-vm config against an x86_64-only package and false-fails.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flake-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval-darwin-configs:
    name: eval darwinConfigurations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix (official installer)
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Evaluate every darwinConfiguration (no build)
        # Shared with update-flake-lock.yml, which must run the same gate itself
        # (its GITHUB_TOKEN-made PR does not trigger this workflow).
        run: bash scripts/ci/eval-darwin-configs.sh

      - name: Household brew shim (eval-level)
        # /etc/zshrc|bashrc on household hosts route other accounts' `brew` to
        # homebrew.user; no other host may carry it.
        run: bash scripts/ci/check-household-brew-shim.sh

      - name: Household compinit / sshd (eval-level)
        # Household /etc/zshrc runs `compinit -i` (other accounts are not asked
        # about the brew user's Homebrew dirs); no SSH host keys or sshd
        # drop-ins on household hosts; every other host unchanged.
        run: bash scripts/ci/check-household-compinit-sshd.sh

      - name: Remote maintenance (eval-level + sshd -T)
        # services.rh7.remoteMaintenance only on kassie-mbp-m1 (rouven) and
        # Kassie-M5-Air13 (kassie): hardened drop-in first, tailnet-only keys
        # for that one account; nobody else. sshd -T proves the include order
        # wins (openssh-server provides sshd and its privsep user/dir).
        run: |
          command -v sshd >/dev/null || sudo apt-get install -y --no-install-recommends openssh-server >/dev/null
          sudo mkdir -p /run/sshd
          bash scripts/ci/check-remote-maintenance.sh

      - name: Fleet audit scheduler (eval-level)
        # Household hosts audit through a system LaunchDaemon running as the
        # primary user (no home-manager LaunchAgent); every other host keeps
        # home-manager's gui LaunchAgent, unchanged.
        run: bash scripts/ci/check-fleet-audit-scheduler.sh

      - name: Daily-user-owned casks (eval-level)
        # dotfiles.homebrew.dailyUserOwnedCasks: only kassie-mbp-m1 (claude →
        # Claude.app, hers); no activation chowns an app bundle (App
        # Management blocks it from launchd); its assertions fire.
        run: bash scripts/ci/check-daily-owned-casks.sh
